base_config: ../scenarios/ucf101_generative_poison_attack.yaml
artifact_root: artifacts/ucf101_poison_strength
m_star_source:
  stage: single_factor
  experiment: B0
screening:
  min_asr_pct: 60.0
  min_delta_asr_percentage_points: 40.0
  max_global_accuracy_drop_percentage_points: 5.0
  max_non_source_accuracy_drop_percentage_points: 3.0
  collapse_global_accuracy_drop_percentage_points: 10.0

stages:
  single_factor:
    # Execute seed 42 first. Add 43/44 only for improved configurations unless
    # server time explicitly permits running the full matrix.
    seeds: [42, 43, 44]
    experiments:
      B0:
        overrides: {}
      M2:
        overrides:
          attack:
            malicious_clients: ["0", "1"]
            malicious_client_count: 2
      M3:
        overrides:
          attack:
            malicious_clients: ["0", "1", "4"]
            malicious_client_count: 3
      P50:
        overrides:
          attack:
            poison_ratio: 0.5
      P100:
        overrides:
          attack:
            poison_ratio: 1.0
      E20:
        overrides:
          generator:
            epochs: 20
      E50:
        overrides:
          generator:
            epochs: 50

  combination:
    seeds: [42, 43, 44]
    experiments:
      C0:
        overrides: {}
      C1:
        overrides:
          attack:
            malicious_clients: ["0", "1"]
            malicious_client_count: 2
          generator:
            epochs: 20
      C2:
        overrides:
          attack:
            malicious_clients: ["0", "1"]
            malicious_client_count: 2
            poison_ratio: 0.5
          generator:
            epochs: 20
      C3:
        overrides:
          attack:
            malicious_clients: ["0", "1", "4"]
            malicious_client_count: 3
            poison_ratio: 0.5
          generator:
            epochs: 50
      C4:
        overrides:
          attack:
            malicious_clients: ["0", "1", "4"]
            malicious_client_count: 3
            poison_ratio: 1.0
          generator:
            epochs: 50
