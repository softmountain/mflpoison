[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.38,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-multimodal"
version = "20230729"
description = "FedMultimodal UCF101 compatibility components and mflpoison runner"
readme = "README.md"
requires-python = ">=3.9,<3.11"
authors = [{name = "Fedpoi maintainers"}]
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=1.13,<1.14",
    "numpy>=1.23,<2",
    "scikit-learn>=1.1,<1.4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
legacy-features = [
    "torchaudio>=0.13,<0.14",
    "torchvision>=0.14,<0.15",
    "tqdm>=4.62,<5",
    "transformers>=4.24,<5",
    "sentencepiece>=0.1.97,<0.2",
    "moviepy>=1,<2",
    "Pillow>=9,<12",
]
analysis = ["matplotlib>=3.6,<4", "seaborn>=0.12,<0.14"]
test = ["pytest>=8,<9", "build>=1.2,<2"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mflpoison*", "fed_multimodal*"]
exclude = ["tests*", "fed_multimodal.results*", "fed_multimodal.datasets*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
