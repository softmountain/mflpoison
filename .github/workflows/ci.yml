name: test

on:
  push:
  pull_request:

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install tested runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==1.13.0+cpu" \
            "numpy==1.25.2" \
            "scikit-learn==1.1.3" \
            "PyYAML==6.0.3"
          python -m pip install "pytest>=8,<9" "build>=1.2,<2"

      - name: Build wheel
        run: python -m build --wheel --outdir wheelhouse

      - name: Verify wheel contents and installed imports
        run: |
          python -m pip install --no-deps wheelhouse/*.whl
          python -m pip install --no-deps wheelhouse/*.whl --target "$RUNNER_TEMP/wheel-install"
          unzip -l wheelhouse/*.whl | grep -E 'mflpoison/__init__.py|fed_multimodal/__init__.py'
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python -c "import fed_multimodal, mflpoison; print('wheel imports ok')"
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python -m mflpoison.runner --help

      - name: Check package requirements
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q
